[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agnara-a8-kernel-validation"
version = "0.1.0"
description = "Kernel validation project for Agnara 0.1.0a8"
authors = [{ name = "Bastian Landskron" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 7 - Inactive",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "agnara==0.1.0a8"
]

[project.urls]
Repository = "https://github.com/agnara-project/agnara-a8-kernel-validation"
Issues = "https://github.com/agnara-project/agnara-a8-kernel-validation/issues"
"Agnara Core" = "https://github.com/Blandskron/agnara"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]
dev = [
    "ruff>=0.1.0",
    "build>=1.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "RUF"]
ignore = []

[tool.hatch.build.targets.wheel]
packages = ["src/refund_service.py"]
