[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agnara-a8-kernel-validation"
version = "0.1.0"
description = "Kernel validation project for Agnara 0.1.0a8"
authors = [{ name = "Blandskron", email = "blandskron@example.com" }]
requires-python = ">=3.14"
dependencies = [
    "agnara==0.1.0a8"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]
dev = [
    "ruff>=0.1.0",
    "build>=1.0.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.hatch.build.targets.wheel]
packages = ["src"]
